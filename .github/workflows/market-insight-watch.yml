name: Background market insight watch

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Fresh-news lookback hours"
        required: false
        default: "6"
      limit:
        description: "Maximum news items to classify"
        required: false
        default: "180"
      send:
        description: "Send alert when the gate passes"
        required: false
        default: "true"
        type: boolean
  schedule:
    # Run away from the normal :00/:30 briefing jobs. Important insights are
    # checked 24/7, but no Telegram message is sent unless the alert gate passes.
    - cron: "17 * * * *"

concurrency:
  group: market-insight-watch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  insight-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
      TELEGRAM_SESSION_NAME: telegram_news_session
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_TARGET_CHAT_ID: ${{ secrets.TELEGRAM_TARGET_CHAT_ID }}
      TELEGRAM_TARGET_CHAT_IDS: ${{ secrets.TELEGRAM_TARGET_CHAT_IDS }}
      DATABASE_URL: sqlite:///data/news.db
      CHANNEL_CONFIG: config/channels.yaml
      TIMEZONE: Asia/Seoul
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      INSIGHT_ALERT_SCORE: "82"
      INSIGHT_COOLDOWN_HOURS: "12"
      INSIGHT_MEMORY_HOURS: "168"
      INSIGHT_GOOGLE_VERIFY: "1"
      INSIGHT_COLLECT_LIMIT_PER_CHANNEL: "120"
      INSIGHT_MARKET_WORKERS: "8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate insight-watch secrets
        run: |
          python - <<'PY'
          import os
          import sys
          from telethon.sessions import StringSession

          def clean(value):
              return "".join(str(value or "").strip().strip('"\'').split())

          required = [
              "TELEGRAM_API_ID",
              "TELEGRAM_API_HASH",
              "TELEGRAM_STRING_SESSION",
              "TELEGRAM_BOT_TOKEN",
              "GEMINI_API_KEY",
          ]
          missing = [name for name in required if not clean(os.getenv(name))]
          if not clean(os.getenv("TELEGRAM_TARGET_CHAT_ID")) and not clean(os.getenv("TELEGRAM_TARGET_CHAT_IDS")):
              missing.append("TELEGRAM_TARGET_CHAT_ID(S)")
          if missing:
              print("Missing insight-watch secrets: " + ", ".join(missing))
              sys.exit(1)
          try:
              StringSession(clean(os.getenv("TELEGRAM_STRING_SESSION")))
          except Exception as exc:
              print(f"Invalid TELEGRAM_STRING_SESSION: {type(exc).__name__}: {exc}")
              sys.exit(1)
          print("Insight-watch secrets validated")
          PY

      - name: Run background insight watch
        env:
          INPUT_HOURS: ${{ github.event.inputs.hours || '6' }}
          INPUT_LIMIT: ${{ github.event.inputs.limit || '180' }}
          INPUT_SEND: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.send || 'true' }}
        run: |
          mkdir -p data reports
          ARGS=(--hours "$INPUT_HOURS" --limit "$INPUT_LIMIT")
          if [ "$INPUT_SEND" = "true" ]; then
            ARGS+=(--send)
          fi
          python scripts/run_insight_watch.py "${ARGS[@]}"

      - name: Commit alert cooldown state
        if: always()
        run: |
          if [ ! -f reports/market_insight_state.json ]; then
            echo "No alert state change; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/market_insight_state.json
          if git diff --cached --quiet; then
            echo "No market insight state changes"
            exit 0
          fi
          git commit -m "Update market insight alert state [skip ci] [skip render]"
          git pull --rebase
          git push

      - name: Upload insight audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-insight-watch
          path: |
            reports/latest_market_insight.json
            reports/market_insight_state.json
          if-no-files-found: ignore
          retention-days: 14
