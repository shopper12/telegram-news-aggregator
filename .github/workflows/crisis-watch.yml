name: Equity crisis watch (5-minute fallback)

on:
  push:
    branches: [main]
    paths:
      - "src/telegram_news/crisis_watch.py"
      - ".github/workflows/crisis-watch.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not send notifications"
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub schedule is best effort; this is NOT exchange real-time.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 0-6,13-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: equity-crisis-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_TARGET_CHAT_ID: ${{ secrets.TELEGRAM_TARGET_CHAT_ID }}
      TELEGRAM_TARGET_CHAT_IDS: ${{ secrets.TELEGRAM_TARGET_CHAT_IDS }}
      CRISIS_MAX_LAG_SEC: "420"
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP client
        run: python -m pip install "requests>=2.31,<3"
      - name: Scan US/KR market
        run: |
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            python scripts/run_crisis_watch.py --dry-run
          else
            python scripts/run_crisis_watch.py
          fi
      - name: Commit cooldown state only after successful alert
        if: success() && env.INPUT_DRY_RUN != 'true'
        run: |
          if [ ! -f reports/crisis_watch_state.json ]; then
            echo "No new alerts"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/crisis_watch_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record crisis alert cooldown [skip ci] [skip render]"
          # Do not lose cooldown history if another commit lands during this run.
          for attempt in 1 2 3 4 5; do
            git pull --rebase
            if git push; then
              exit 0
            fi
            echo "Concurrent push detected; retry $attempt"
            sleep 2
          done
          exit 1
